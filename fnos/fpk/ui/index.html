<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DockerOps</title>
  <style>
    body { margin: 0; font-family: system-ui, "PingFang SC", sans-serif; background: #0a0a0f; color: #e8eefc; }
    .wrap { max-width: 520px; margin: 12vh auto; padding: 2rem; border: 1px solid rgba(0,243,255,.2); border-radius: 14px; background: #12161f; }
    h1 { margin: 0 0 .5rem; font-size: 1.4rem; }
    p { color: #93a0b8; line-height: 1.6; }
    a.btn { display: inline-block; margin-top: 1rem; padding: .6rem 1rem; background: #6c5ce7; color: #fff; border-radius: 10px; text-decoration: none; }
    code { color: #00f3ff; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>DockerOps</h1>
    <p>飞牛桌面入口已切换为智能跳转（使用当前主机名，避免 127.0.0.1 黑屏）。</p>
    <p>若未自动打开，请访问：</p>
    <p><a class="btn" id="go" href="#" target="_top" rel="noopener">打开 DockerOps 控制台</a></p>
    <p>目标：<code id="target">…</code></p>
  </div>
  <script>
    (function () {
      var port = "8080";
      try {
        var m = document.cookie.match(/(?:^|; )dockerops_port=(\d+)/);
        if (m) port = m[1];
      } catch (e) {}
      var url = "http://" + (location.hostname || "127.0.0.1") + ":" + port + "/";
      document.getElementById("go").href = url;
      document.getElementById("target").textContent = url;
      try { top.location.href = url; } catch (e) { location.href = url; }
    })();
  </script>
</body>
</html>
