<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }} — {{ subtitle }}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="logo">DO</div>
      <div>
        <h1>{{ title }}</h1>
        <p class="muted">{{ subtitle }}</p>
      </div>
    </div>
    <div class="header-actions">
      <div id="auth-state" class="muted">未登录（只读）</div>
      <button id="btn-refresh" class="btn">刷新</button>
      <button id="btn-login" class="btn primary">登录</button>
    </div>
  </header>

  <main class="grid">
    <section class="card score-card">
      <h2>健康分</h2>
      <div id="health-score" class="score">--</div>
      <div id="health-label" class="badge">加载中</div>
      <ul id="advice" class="advice"></ul>
    </section>

    <section class="card">
      <h2>引擎 / 摘要</h2>
      <pre id="engine-info" class="mono">加载中…</pre>
    </section>

    <section class="card wide">
      <div class="row-between">
        <h2>容器</h2>
        <span id="container-count" class="muted"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>名称</th>
              <th>镜像</th>
              <th>状态</th>
              <th>健康</th>
              <th>重启</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="container-rows">
            <tr><td colspan="6" class="muted">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="card wide">
      <h2>Doctor 发现</h2>
      <div id="findings" class="findings">加载中…</div>
    </section>

    <section class="card wide">
      <h2>运维记录</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>时间</th>
              <th>动作</th>
              <th>目标</th>
              <th>状态</th>
              <th>操作者</th>
            </tr>
          </thead>
          <tbody id="ops-rows">
            <tr><td colspan="5" class="muted">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="login-dialog">
    <form method="dialog" id="login-form">
      <h3>登录 DockerOps</h3>
      <label>用户名 <input name="username" value="admin" required /></label>
      <label>密码 <input name="password" type="password" required /></label>
      <p id="login-error" class="error" hidden></p>
      <div class="row-between">
        <button type="button" class="btn" id="login-cancel">取消</button>
        <button type="submit" class="btn primary">确定</button>
      </div>
    </form>
  </dialog>

  <footer class="foot muted">
    Web 控制台以只读为主 · 写操作走 API ·
    <a href="/docs" target="_blank" rel="noopener">Swagger</a>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
